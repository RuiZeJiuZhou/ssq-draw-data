name: 抓取双色球最新开奖
# 说明：GitHub 服务器访问福彩官网会被网宿 WAF 拦截（实测 403），
# 因此开奖当晚能否抓到取决于备用源是否可用；抓不到时静默跳过，不产生提交。
on:
  push:
    paths: ['trigger.txt']
  schedule:
    # 开奖日（UTC 周二/四/日）= 北京周二/四/日，21:00-23:45 每 15 分钟
    - cron: '0,15,30,45 13-15 * * 2,4,0'
    # 凌晨兜底：北京 01:00-03:30，第三方镜像通常此时已入库
    - cron: '0,30 17-19 * * 2,4,0'
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/fetch.mjs
      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git diff --staged --quiet || git commit -m "chore: ssq $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
