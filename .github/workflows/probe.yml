name: 数据源探测（临时）
on:
  push:
    paths: ['trigger.txt']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/probe2.mjs
      - name: 提交探测结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --staged --quiet || git commit -m "probe2 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
